spring.application.name=saboriq

# Servidor
server.port=8081

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/saboriq_db
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Open Session in View
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=ym3QbD8hica2FUTM7l0D2LIH/++L3Vh/22znwjsMh1Q=
app.jwt.expiration=3600
app.jwt.issuer=saboriq-backend

# Perfil de desarrollo
spring.profiles.active=dev

# Administrador inicial
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=admin@saboriq.com
app.bootstrap.admin.password=Admin12345!

spring.jackson.deserialization.fail-on-unknown-properties=true  
server.error.include-stacktrace=never
server.error.include-message=never


